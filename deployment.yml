apiVersion: apps/v1
kind: Deployment

metadata:
  name: picas-y-fijas
  namespace: unillanos
  labels:
    app: picas-y-fijas

spec:
  replicas: 1

  selector:
    matchLabels:
      app: picas-y-fijas

  template:
    metadata:
      labels:
        app: picas-y-fijas

    spec:
      containers:
        - name: juego-container
          image: juego:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"